name: Repository quality

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877 # cargo-llvm-cov

      # Restore-only: the e2e job warms and saves this cache with the same check, clippy and
      # llvm-cov builds that `make checks` runs, so both jobs never race to save one key.
      - name: Restore e2e build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('test/e2e-rs/Cargo.lock', 'test/e2e-rs/src/**', 'test/e2e-rs/suites/**') }}
          restore-keys: |
            e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        run: make checks

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EAS_TOOLS_TABS: "4"
      E2E_RUNNER: container
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The voice packages are ~1.4 GB of LFS; the e2e suite only needs eSpeak's.
      - name: Fetch eSpeak data from LFS
        run: git lfs pull --include="assets/wasm_tts_voices/espeak/espeak-ng.eas.data"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877 # cargo-llvm-cov

      # Restored and saved explicitly: post-step caches (rust-cache, setup-node) only save
      # when the whole job succeeds, so a failing test run never wrote one.
      - name: Restore e2e build cache
        id: e2e-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('test/e2e-rs/Cargo.lock', 'test/e2e-rs/src/**', 'test/e2e-rs/suites/**') }}
          restore-keys: |
            e2e-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      # check, clippy and llvm-cov each keep their own artifacts, separate from a test build;
      # warm every flavour `make e2e` uses so the saved cache covers all of them.
      - name: Build e2e suite
        run: |
          cargo check --manifest-path test/e2e-rs/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path test/e2e-rs/Cargo.toml --all-targets --locked
          cargo llvm-cov --manifest-path test/e2e-rs/Cargo.toml --lib --locked --no-report
          cargo test --manifest-path test/e2e-rs/Cargo.toml --test e2e --no-run

      - name: Save e2e build cache
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/e2e-rs/target/
          key: ${{ steps.e2e-cache.outputs.cache-primary-key }}

      # The container runner only builds the image itself when it is missing; building it here
      # first lets the apt and cargo layers come from the Actions cache instead of a cold build.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build e2e container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: test/e2e-rs/Dockerfile
          tags: eas-tools-e2e:local
          load: true
          push: false
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max

      - name: Run e2e suite
        run: make e2e
